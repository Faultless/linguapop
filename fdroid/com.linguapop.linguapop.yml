AntiFeatures:
  NonFreeNet:
    en-US: Articles are fetched from NHK and the Mainichi Shimbun, dictionary entries
      from Jisho, and optional machine translation from Google Translate. All are
      non-free network services. The app has no accounts and no telemetry, and makes
      no request that the user did not ask for.
Categories:
  - News
  - Reading
  - Science & Education
License: GPL-3.0-or-later
AuthorName: Serge Kamel
SourceCode: https://github.com/Faultless/linguapop-extension
IssueTracker: https://github.com/Faultless/linguapop-extension/issues
Changelog: https://github.com/Faultless/linguapop-extension/releases

AutoName: LinguaPop

RepoType: git
Repo: https://github.com/Faultless/linguapop-extension.git

Builds:
  - versionName: 7.3.0
    versionCode: 1011
    commit: v7.3.0
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - git -C $$flutter$$ checkout -f $(cat FLUTTER_VERSION)
      - sed -i -e '/signingConfig = signingConfigs.getByName("debug")/d' android/app/build.gradle.kts
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scanignore:
      - assets/ipadic
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
    ndk: 28.2.13676358

