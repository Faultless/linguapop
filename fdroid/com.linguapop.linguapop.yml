AntiFeatures:
  NonFreeNet:
    en-US: News is fetched from NHK and the Mainichi Shimbun, including automatically
      when the app opens. Dictionary entries come from Jisho, web novels from Syosetu,
      machine translation from Google Translate and MyMemory, and optional cover art
      from Google Books (off by default). All are non-free network services. The app
      has no accounts and no telemetry.
Categories:
